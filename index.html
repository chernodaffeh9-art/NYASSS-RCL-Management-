<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYASSS-RCL Management</title>
</head>
<body>

  <h1>NYASSS-RCL Management</h1>

  <p>
    New Yundum Academic Senior Secondary School Red Cross Link
  </p>

  <hr>

  <h2>Credential Verification</h2>

  <p>
    Enter a credential verification code to check an authorized
    NYASSS-RCL credential.
  </p>

  <input
    type="text"
    id="verificationCode"
    placeholder="Enter verification code"
  >

  <button onclick="verifyCredential()">Verify</button>

  <div id="result"></div>

  <script>
    function verifyCredential() {
      const code = document.getElementById("verificationCode").value.trim();
      const result = document.getElementById("result");

      if (!code) {
        result.innerHTML = "<p>Please enter a verification code.</p>";
        return;
      }

      result.innerHTML =
        "<p>Verification system is being connected to the secure member database.</p>";
    }
  </script>
<script>

async function verifyCredential() {
  const code = document
    .getElementById("verificationCode")
    .value
    .trim()
    .toUpperCase();

  const result = document.getElementById("result");

  if (!code) {
    result.innerHTML = "<p>Please enter a verification code.</p>";
    return;
  }

  result.innerHTML = "<p>Checking credential...</p>";

  try {
    const response = await fetch("members.json");
    const data = await response.json();

    const member = data.members.find(
      item => item.credentialCode.toUpperCase() === code
    );

    if (!member) {
      result.innerHTML =
        "<p><strong>Credential not found.</strong></p>";
      return;
    }

    result.innerHTML = `
      <div class="card">
        <h2>Credential Verified</h2>
        <p><strong>Name:</strong> ${member.fullName}</p>
        <p><strong>Member ID:</strong> ${member.memberId}</p>
        <p><strong>Position:</strong> ${member.position}</p>
        <p><strong>Status:</strong> ${member.status}</p>
        <p><strong>Issue Date:</strong> ${member.issueDate}</p>
        <p><strong>Expiry Date:</strong> ${member.expiryDate}</p>
      </div>
    `;

  } catch (error) {
    result.innerHTML =
      "<p>Unable to connect to the credential database.</p>";
  }
}
</script>


</body>
</html>
